<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移倉裝車管理系統 - Excel 優化版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --dark: #212529; --load: #6f42c1; --gray: #adb5bd; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #f1f3f5; margin: 0; padding-bottom: 160px; }
        
        /* 頂部車位看板 */
        .header { background: var(--dark); padding: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .truck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .truck-slot { background: #343a40; border: 2px solid transparent; border-radius: 6px; padding: 8px; color: #fff; text-align: center; cursor: pointer; transition: 0.2s; }
        .truck-slot.active { border-color: var(--primary); background: #495057; }
        .truck-slot.has-data { border-bottom: 4px solid var(--success); }
        .truck-slot.full { border-bottom: 4px solid var(--danger); }
        
        /* 搜尋與新增區 */
        .search-area { background: #fff; padding: 10px; border-bottom: 1px solid #dee2e6; display: flex; gap: 5px; }
        .search-bar { flex: 1; padding: 12px; border: 1px solid #ced4da; border-radius: 5px; font-size: 16px; }

        /* 卡片清單 */
        .list-container { padding: 10px; }
        .item-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 6px solid var(--gray); position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; }
        .item-card.is-locked { border-left-color: var(--load); }
        .item-card.on-truck { border-left-color: var(--success); background: #f8fff9; }
        .item-card.abnormal { border-left-color: var(--danger); }

        .qty-row { display: flex; align-items: center; background: #f8f9fa; padding: 8px; border-radius: 6px; margin: 10px 0; }
        .qty-btn { width: 45px; height: 45px; border: 1px solid #ddd; background: #fff; font-size: 22px; border-radius: 5px; cursor: pointer; }
        .qty-btn:disabled { background: #ddd; color: #aaa; }
        .qty-val { flex: 1; text-align: center; font-size: 26px; font-weight: bold; color: var(--dark); }

        .btn { padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-load { background: var(--load); color: white; width: 100%; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .btn-gray { background: var(--gray); color: white; }

        /* 底部工具列 */
        .footer-tools { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 10px; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); z-index: 99; }
        .tool-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }

        /* 彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 400px; }
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header">
    <div style="color:white; font-size:12px; display:flex; justify-content:space-between;">
        <strong>📋 移倉作業系統 (Excel 狀態簡化版)</strong>
        <span id="date-label"></span>
    </div>
    <div class="truck-grid" id="truckGrid"></div>
</div>

<div class="search-area">
    <input type="text" id="search" class="search-bar" placeholder="🔍 搜尋儲位或品名..." onkeyup="render()">
    <button class="btn btn-blue" onclick="openAddModal()">＋臨時</button>
</div>

<div class="list-container" id="cardList"></div>

<div class="footer-tools">
    <button class="btn btn-green" style="width:100%; font-size:16px;" onclick="exportExcel()">📊 匯出今日移倉總表 (Excel)</button>
    <div class="tool-row">
        <button class="btn btn-blue" onclick="exportProgress()">💾 備份</button>
        <button class="btn btn-blue" onclick="document.getElementById('importFile').click()">📂 匯入</button>
        <button class="btn btn-red" onclick="resetSystem()">🧹 重置</button>
    </div>
    <input type="file" id="importFile" style="display:none" onchange="importProgress(event)">
</div>

<!-- 彈窗內容 -->
<div id="truckModal" class="modal"><div class="modal-content">
    <h3>設定車位看板</h3>
    <input type="text" id="truckPlate" class="input-box" placeholder="車牌號碼 (例: ABC-1234)">
    <input type="number" id="truckSeq" class="input-box" placeholder="車次 (例: 1)">
    <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-gray" style="flex:1" onclick="closeModal('truckModal')">取消</button>
        <button class="btn btn-blue" style="flex:2" onclick="saveTruckInfo()">確認設定</button>
    </div>
</div></div>

<div id="addModal" class="modal"><div class="modal-content">
    <h3>➕ 新增臨時品項</h3>
    <input type="text" id="newLoc" class="input-box" placeholder="儲位">
    <input type="text" id="newName" class="input-box" placeholder="品名規格">
    <input type="number" id="newQty" class="input-box" placeholder="數量">
    <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-gray" style="flex:1" onclick="closeModal('addModal')">取消</button>
        <button class="btn btn-load" style="flex:2" onclick="addNew()">加入名單</button>
    </div>
</div></div>

<script>
    const rawData = [
        {loc:"1C2903", item:"24601003001", name:"冷凍美國CR安格斯牛五花火鍋片袋裝500G", sys:30, date:"20261222"},
        {loc:"1C2904", item:"24601003001", name:"冷凍美國CR安格斯牛五花火鍋片袋裝500G", sys:30, date:"20261222"},
        {loc:"1C3001", item:"24601003001", name:"冷凍美國CR安格斯牛五花火鍋片袋裝500G", sys:30, date:"20261222"},
        {loc:"1C3303", item:"24200002001", name:"威保 - 冷凍紐西蘭 - 全羊火鍋肉片1KG", sys:30, date:"20270202"},
        {loc:"3B0301", item:"24600105001", name:"立大冷凍豬五花火鍋肉片1000G", sys:50, date:"20270130"},
        {loc:"3B0501", item:"23904988001", name:"立基 - 冷凍9吋 油酥厚餅", sys:28, date:"20270128"},
        {loc:"3B0902", item:"23904988001", name:"立基 - 冷凍9吋 油酥厚餅", sys:28, date:"20270302"},
        {loc:"3B1301", item:"24200074001", name:"舍利蓮冷凍紐西蘭小羔羊梅花肉片500G", sys:49, date:"20270131"},
        {loc:"3B1401", item:"24600005001", name:"思牧 - 冷凍豬五花火鍋片500G(袋裝)", sys:35, date:"20270210"},
        {loc:"3B3901", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:23, date:"20260901"},
        {loc:"3B3902", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260901"},
        {loc:"3B3903", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260901"},
        {loc:"3B4102", item:"24601107001", name:"美國CR安格斯牛 五花火鍋片1000G", sys:32, date:"20261218"},
        {loc:"3B4702", item:"23904125001", name:"泉泓冷凍蜂蜜蛋糕", sys:28, date:"20260902"},
        {loc:"3B4703", item:"23904125001", name:"泉泓冷凍蜂蜜蛋糕", sys:28, date:"20260902"},
        {loc:"3B4801", item:"23904040001", name:"泉泓起酥蛋糕", sys:28, date:"20260903"},
        {loc:"3B4802", item:"23904040001", name:"泉泓起酥蛋糕", sys:28, date:"20260903"},
        {loc:"3B4803", item:"23904040001", name:"泉泓起酥蛋糕", sys:28, date:"20260903"},
        {loc:"3B4901", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260823"},
        {loc:"3B4903", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260823"},
        {loc:"3F1402", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260824"},
        {loc:"3F1403", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260824"},
        {loc:"4B0701", item:"24601108001", name:"舍利蓮冷凍澳洲穀飼 - 牛雪花肉片500G", sys:49, date:"20270131"},
        {loc:"4B0702", item:"24601108001", name:"舍利蓮冷凍澳洲穀飼 - 牛雪花肉片500G", sys:49, date:"20270131"},
        {loc:"4B1102", item:"24200074001", name:"舍利蓮冷凍紐西蘭小羔羊梅花肉片500G", sys:49, date:"20270131"},
        {loc:"4B1401", item:"24600001001", name:"思牧 - 冷凍豬梅花火鍋片500G(袋裝)", sys:35, date:"20270210"},
        {loc:"4B1802", item:"24920267001", name:"威保 - 美國冷凍去骨腿排", sys:42, date:"20270202"},
        {loc:"4B1803", item:"24920267001", name:"威保 - 美國冷凍去骨腿排", sys:42, date:"20270202"}
    ];

    let truckSlots = Array.from({length: 6}, (_, i) => ({ id: i, plate: "", seq: 1 }));
    let products = [];
    let activeIdx = 0;

    function init() {
        const saved = localStorage.getItem('transfer_excel_state');
        if (saved) {
            const state = JSON.parse(saved);
            products = state.products;
            truckSlots = state.truckSlots;
            activeIdx = state.activeIdx || 0;
        } else {
            products = JSON.parse(JSON.stringify(rawData)).map((p, i) => ({ ...p, id: i, act: p.sys, locked: false, truckIdx: -1, abnormal: false, note: "" }));
        }
        render();
    }

    function autoSave() {
        localStorage.setItem('transfer_excel_state', JSON.stringify({ products, truckSlots, activeIdx }));
    }

    function render() {
        const now = new Date();
        const ds = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
        document.getElementById('date-label').innerText = ds;

        const grid = document.getElementById('truckGrid');
        grid.innerHTML = "";
        truckSlots.forEach((slot, idx) => {
            const count = products.filter(p => p.truckIdx === idx).length;
            const div = document.createElement('div');
            div.className = `truck-slot ${activeIdx === idx ? 'active' : ''} ${count > 0 ? 'has-data' : ''} ${count >= 14 ? 'full' : ''}`;
            div.innerHTML = `<span style="font-size:12px; font-weight:bold; display:block;">${slot.plate || `車位 ${idx+1}`}</span><span style="font-size:10px;">${count}/14</span>`;
            div.onclick = () => { if (activeIdx === idx || !slot.plate) openTruckModal(idx); else { activeIdx = idx; render(); autoSave(); } };
            grid.appendChild(div);
        });

        const key = document.getElementById('search').value.toUpperCase();
        const container = document.getElementById('cardList');
        container.innerHTML = "";
        products.filter(p => p.loc.includes(key) || p.name.includes(key)).forEach(p => {
            const div = document.createElement('div');
            div.className = `item-card ${p.locked ? 'is-locked' : ''} ${p.truckIdx === activeIdx ? 'on-truck' : ''} ${p.abnormal ? 'abnormal' : ''}`;
            div.innerHTML = `
                <button style="position:absolute; right:10px; top:10px; font-size:24px; border:none; background:none;" onclick="toggleLock(${p.id})">${p.locked ? (p.truckIdx === activeIdx ? '✅' : '🔒') : '🔓'}</button>
                <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">
                    ${p.locked ? `<span style="background:var(--load); color:white; padding:1px 5px; border-radius:3px; margin-right:5px; font-size:10px;">清點完畢待上車</span>` : ''}
                    ${p.loc} | ${p.name}
                </div>
                <div class="qty-row">
                    <button class="qty-btn" onclick="updateQty(${p.id},-1)" ${p.locked?'disabled':''}>-</button>
                    <div class="qty-val">${p.act}</div>
                    <button class="qty-btn" onclick="updateQty(${p.id},1)" ${p.locked?'disabled':''}>+</button>
                </div>
                <div style="display:flex; align-items:center; margin-top:8px; gap:10px;">
                    <label style="font-size:13px;"><input type="checkbox" ${p.abnormal ? 'checked' : ''} onchange="toggleAb(${p.id})" ${p.locked ? 'disabled' : ''}> 異常</label>
                    <input type="text" class="input-box" style="margin:0; height:30px; font-size:12px;" placeholder="備註..." value="${p.note||''}" onchange="updateNote(${p.id}, this.value)" ${p.locked ? 'disabled' : ''}>
                </div>
                ${p.locked ? 
                  (p.truckIdx === activeIdx ? `<button class="btn btn-gray" style="width:100%; margin-top:10px;" onclick="unassign(${p.id})">移回待分派</button>` : 
                  (p.truckIdx === -1 ? `<button class="btn btn-blue" style="width:100%; margin-top:10px;" onclick="assign(${p.id})">指派至當前車位上車</button>` : 
                  `<div style="text-align:center; font-size:12px; color:green; font-weight:bold; margin-top:10px;">已裝載車牌: ${truckSlots[p.truckIdx].plate}</div>`)) : 
                  `<button class="btn btn-load" style="margin-top:10px;" onclick="lockItem(${p.id})">清點完畢待上車</button>`
                }
            `;
            container.appendChild(div);
        });
    }

    function updateQty(id, d) { products.find(p=>p.id===id).act += d; render(); autoSave(); }
    function toggleAb(id) { products.find(p=>p.id===id).abnormal = !products.find(p=>p.id===id).abnormal; render(); autoSave(); }
    function updateNote(id, v) { products.find(p=>p.id===id).note = v; render(); autoSave(); }
    function lockItem(id) { products.find(p=>p.id===id).locked = true; render(); autoSave(); }
    function unlock(id) { products.find(p=>p.id===id).locked = false; render(); autoSave(); }
    function assign(id) {
        if (!truckSlots[activeIdx].plate) { alert("請先設定車牌"); openTruckModal(activeIdx); return; }
        if (products.filter(p=>p.truckIdx === activeIdx).length >= 14) { alert("此車已滿"); return; }
        products.find(p=>p.id===id).truckIdx = activeIdx;
        render(); autoSave();
    }
    function unassign(id) { products.find(p=>p.id===id).truckIdx = -1; render(); autoSave(); }
    function toggleLock(id) { const p = products.find(i=>i.id===id); if(!p.locked) lockItem(id); else if(p.truckIdx === activeIdx) unassign(id); else if(p.truckIdx === -1) unlock(id); }

    function openTruckModal(idx) { activeIdx = idx; document.getElementById('truckPlate').value = truckSlots[idx].plate; document.getElementById('truckSeq').value = truckSlots[idx].seq; openModal('truckModal'); }
    function saveTruckInfo() { truckSlots[activeIdx].plate = document.getElementById('truckPlate').value.toUpperCase(); truckSlots[activeIdx].seq = document.getElementById('truckSeq').value; closeModal('truckModal'); render(); autoSave(); }
    function resetSystem() { if(confirm("確定重置數據？")){ localStorage.removeItem('transfer_excel_state'); location.reload(); } }
    function exportProgress() { const b = new Blob([JSON.stringify({products, truckSlots, activeIdx})], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `移倉備份.json`; a.click(); }
    function importProgress(e) { const r = new FileReader(); r.onload = (ev) => { const s = JSON.parse(ev.target.result); products = s.products; truckSlots = s.truckSlots; activeIdx = s.activeIdx; render(); autoSave(); alert("進度已匯入"); }; r.readAsText(e.target.files[0]); }

    // 【核心優化】Excel 匯出邏輯
    function exportExcel() {
        const rows = [["作業日期", "車牌號碼", "趟次", "儲位", "品號", "品名規格", "系統數", "實裝數", "差異", "狀態", "備註"]];
        const ds = document.getElementById('date-label').innerText;
        products.forEach(p => {
            const t = p.truckIdx !== -1 ? truckSlots[p.truckIdx] : null;
            
            // 決定狀態：異常優先顯示，否則只要有鎖定(完成清點或裝車)就顯示已完成
            let status = p.abnormal ? "有異常" : (p.locked ? "已完成" : "待處理");
            
            rows.push([ds, t?t.plate:"", t?t.seq:"", p.loc, p.item, p.name, p.sys, p.act, p.act-p.sys, status, p.note]);
        });
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "移倉表");
        XLSX.writeFile(wb, `${ds}_移倉.xlsx`);
    }

    function openModal(id) { document.getElementById(id).style.display='flex'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function openAddModal() { openModal('addModal'); }
    function addNew() {
        const n = document.getElementById('newName').value;
        const q = parseInt(document.getElementById('newQty').value) || 0;
        if(!n || q <= 0) return alert("請輸入品名與數量");
        products.push({ id: Date.now(), loc: document.getElementById('newLoc').value, item: "臨時", name: n, sys: 0, act: q, locked: false, truckIdx: -1, abnormal: false, note: "" });
        closeModal('addModal'); render(); autoSave();
    }

    window.onload = init;
</script>
</body>
</html>
