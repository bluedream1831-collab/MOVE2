<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移倉裝車管理系統 V10 - 車次版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --beef: #d63031; --pork: #fd79a8; --lamb: #e17055; --cake: #fdcb6e; --chicken: #55efc4; --dark: #2d3436; --primary: #0984e3; --load: #6c5ce7; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #dfe6e9; margin: 0; padding-bottom: 120px; }
        
        /* 頂部車次看板 */
        .truck-header { background: var(--dark); padding: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .truck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .truck-slot { background: #636e72; border-radius: 6px; padding: 8px; color: #fff; text-align: center; border: 2px solid transparent; transition: 0.2s; font-size: 13px; }
        .truck-slot.active { border-color: #74b9ff; background: #2d3436; box-shadow: 0 0 10px rgba(116, 185, 255, 0.5); }
        .truck-slot.full { border-bottom: 4px solid var(--beef); }

        /* 工具區 */
        .sticky-tools { position: sticky; top: 105px; z-index: 99; background: white; padding: 10px; border-bottom: 1px solid #ddd; }
        .cat-tabs { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 10px; padding-bottom: 5px; }
        .cat-btn { padding: 6px 15px; border-radius: 15px; border: 1px solid #ddd; background: #f1f2f6; white-space: nowrap; font-size: 13px; font-weight: bold; }
        .cat-btn.active { background: var(--dark); color: white; }
        .search-bar { width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 16px; box-sizing: border-box; }

        /* 卡片設計 */
        .list-container { padding: 10px; }
        .item-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-left: 10px solid #ccc; position: relative; }
        .item-card.is-locked { border-left-color: var(--load); }
        .item-card.on-truck { border-left-color: #00b894; background: #f0fff4; }
        
        .type-beef { border-left-color: var(--beef); }
        .type-pork { border-left-color: var(--pork); }
        .type-lamb { border-left-color: var(--lamb); }
        .type-cake { border-left-color: var(--cake); }
        .type-chicken { border-left-color: var(--chicken); }

        .date-tag { color: #0984e3; font-weight: bold; font-family: monospace; font-size: 14px; }

        .qty-control { display: flex; align-items: center; margin: 12px 0; }
        .qty-btn { flex: 1; height: 50px; background: #fff; border: 1px solid #dfe6e9; font-size: 26px; border-radius: 8px; }
        .qty-val { width: 70px; text-align: center; font-size: 28px; font-weight: bold; }

        .abnormal-group { background: #fff5f5; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
        .abnormal-item { display: block; font-size: 14px; margin-bottom: 6px; color: #d63031; font-weight: bold; }

        /* 底部按鈕 */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); z-index: 101; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-main { padding: 16px; border-radius: 10px; border: none; font-size: 15px; font-weight: bold; color: white; cursor: pointer; text-align: center; }

        /* 安全重置 */
        .reset-container { text-align: center; padding: 20px 0 40px 0; }
        .btn-reset-small { background: none; border: 1px solid #d63031; color: #d63031; padding: 5px 15px; border-radius: 4px; font-size: 12px; cursor: pointer; opacity: 0.5; }

        /* PDF 樣式 */
        #print-report { display: none; }
        @media print {
            body { background: white; padding: 0; }
            .no-print, .sticky-tools, .footer, .truck-header, .reset-container { display: none !important; }
            #print-report { display: block !important; padding: 10px; }
            table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
            th, td { border: 1px solid black; padding: 3px; text-align: left; }
            th { background: #eee !important; }
            .title { text-align: center; font-size: 18px; font-weight: bold; }
            .info { display: flex; justify-content: space-between; margin: 5px 0; font-size: 12px; border-bottom: 2px solid #000; padding-bottom: 3px; }
        }
    </style>
</head>
<body>

<div class="truck-header no-print">
    <div style="color:white; font-size:11px; margin-bottom:5px;">🚚 當前車次選擇 (點擊設定車牌)</div>
    <div class="truck-grid" id="truckGrid"></div>
</div>

<div class="sticky-tools no-print">
    <div class="cat-tabs" id="catTabs">
        <button class="cat-btn active" onclick="setCat('ALL')">全部</button>
        <button class="cat-btn" onclick="setCat('牛')">牛肉類</button>
        <button class="cat-btn" onclick="setCat('豬')">豬肉類</button>
        <button class="cat-btn" onclick="setCat('蛋糕')">蛋糕類</button>
        <button class="cat-btn" onclick="setCat('其餘')">其他</button>
    </div>
    <input type="text" id="search" class="search-bar" placeholder="🔍 搜尋效期、品號或名稱..." onkeyup="render()">
</div>

<div class="list-container no-print" id="cardList"></div>

<div class="reset-container no-print">
    <button class="btn-reset-small" onclick="resetSystem()">⚠️ 重置今日所有數據</button>
</div>

<div class="footer no-print">
    <button class="btn-main" style="background:#e67e22;" onclick="generatePDF()">📄 產生 PDF 報表</button>
    <button class="btn-main" style="background:#28a745;" onclick="exportExcel()">📊 匯出 Excel 總表</button>
</div>

<!-- PDF 報表 -->
<div id="print-report">
    <div class="title">移倉裝車明細報表</div>
    <div class="info">
        <div id="p-date">日期：</div>
        <div id="p-truck">作業範圍：全部趟次</div>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width:10%">車牌/車次</th>
                <th style="width:10%">品號</th>
                <th style="width:32%">品名規格</th>
                <th style="width:12%">有效日期</th>
                <th style="width:5%">預</th>
                <th style="width:5%">實</th>
                <th style="width:26%">異常狀態與備註</th>
            </tr>
        </thead>
        <tbody id="print-body"></tbody>
    </table>
    <div style="margin-top:20px; text-align:right;">現場核對人簽名：____________________</div>
</div>

<script>
    const rawData = [
        {loc:"1C2903", item:"24601003001", name:"冷凍美國CR安格斯牛五花火鍋片袋裝500G", sys:30, date:"20261222"},
        {loc:"1C2904", item:"24601003001", name:"冷凍美國CR安格斯牛五花火鍋片袋裝500G", sys:30, date:"20261222"},
        {loc:"1C3001", item:"24601003001", name:"冷凍美國CR安格斯牛五花火鍋片袋裝500G", sys:30, date:"20261222"},
        {loc:"1C3303", item:"24200002001", name:"威保 - 冷凍紐西蘭 - 全羊火鍋肉片1KG", sys:30, date:"20270202"},
        {loc:"3B0301", item:"24600105001", name:"立大冷凍豬五花火鍋肉片1000G", sys:50, date:"20270130"},
        {loc:"3B0501", item:"23904988001", name:"立基 - 冷凍9吋 油酥厚餅", sys:28, date:"20270128"},
        {loc:"3B0902", item:"23904988001", name:"立基 - 冷凍9吋 油酥厚餅", sys:28, date:"20270302"},
        {loc:"3B1301", item:"24200074001", name:"舍利蓮冷凍紐西蘭小羔羊梅花肉片500G", sys:49, date:"20270131"},
        {loc:"3B1401", item:"24600005001", name:"思牧 - 冷凍豬五花火鍋片500G(袋裝)", sys:35, date:"20270210"},
        {loc:"3B3901", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:23, date:"20260901"},
        {loc:"3B3902", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260901"},
        {loc:"3B3903", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260901"},
        {loc:"3B4102", item:"24601107001", name:"美國CR安格斯牛 五花火鍋片1000G", sys:32, date:"20261218"},
        {loc:"3B4702", item:"23904125001", name:"泉泓冷凍蜂蜜蛋糕", sys:28, date:"20260902"},
        {loc:"3B4703", item:"23904125001", name:"泉泓冷凍蜂蜜蛋糕", sys:28, date:"20260902"},
        {loc:"3B4801", item:"23904040001", name:"泉泓起酥蛋糕", sys:28, date:"20260903"},
        {loc:"3B4802", item:"23904040001", name:"泉泓起酥蛋糕", sys:28, date:"20260903"},
        {loc:"3B4803", item:"23904040001", name:"泉泓起酥蛋糕", sys:28, date:"20260903"},
        {loc:"3B4901", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260823"},
        {loc:"3B4903", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260823"},
        {loc:"3F1402", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260824"},
        {loc:"3F1403", item:"23904009001", name:"泉泓起酥蛋糕(家庭號)", sys:24, date:"20260824"},
        {loc:"4B0701", item:"24601108001", name:"舍利蓮冷凍澳洲穀飼 - 牛雪花肉片500G", sys:49, date:"20270131"},
        {loc:"4B0702", item:"24601108001", name:"舍利蓮冷凍澳洲穀飼 - 牛雪花肉片500G", sys:49, date:"20270131"},
        {loc:"4B1102", item:"24200074001", name:"舍利蓮冷凍紐西蘭小羔羊梅花肉片500G", sys:49, date:"20270131"},
        {loc:"4B1401", item:"24600001001", name:"思牧 - 冷凍豬梅花火鍋片500G(袋裝)", sys:35, date:"20270210"},
        {loc:"4B1802", item:"24920267001", name:"威保 - 美國冷凍去骨腿排", sys:42, date:"20270202"},
        {loc:"4B1803", item:"24920267001", name:"威保 - 美國冷凍去骨腿排", sys:42, date:"20270202"}
    ];

    let products = [];
    let truckSlots = Array.from({length: 6}, (_, i) => ({ id: i, plate: "", seq: (i + 1) }));
    let activeIdx = 0;
    let curCat = 'ALL';

    function init() {
        const saved = localStorage.getItem('warehouse_v10_trip');
        if (saved) {
            const state = JSON.parse(saved);
            products = state.products;
            truckSlots = state.truckSlots;
            activeIdx = state.activeIdx || 0;
        } else {
            products = rawData.map((p, i) => ({ 
                ...p, id: i, act: p.sys, locked: false, truckIdx: -1, 
                abImg: false, abExp: false, abMix: false, note: "" 
            }));
        }
        render();
    }

    function autoSave() {
        localStorage.setItem('warehouse_v10_trip', JSON.stringify({ products, truckSlots, activeIdx }));
    }

    function setCat(c) { curCat = c; render(); }
    function getType(name) {
        if(name.includes('牛')) return 'beef';
        if(name.includes('豬')) return 'pork';
        if(name.includes('蛋糕')) return 'cake';
        return 'chicken';
    }

    function render() {
        // 車次看板
        const grid = document.getElementById('truckGrid');
        grid.innerHTML = "";
        truckSlots.forEach((slot, idx) => {
            const count = products.filter(p => p.truckIdx === idx).length;
            const div = document.createElement('div');
            div.className = `truck-slot ${activeIdx === idx ? 'active' : ''} ${count >= 14 ? 'full' : ''}`;
            div.innerHTML = `<b>${slot.plate || `第 ${slot.seq} 趟`}</b><br><small>${count}/14 板</small>`;
            div.onclick = () => {
                if(activeIdx === idx || !slot.plate) {
                    const p = prompt("輸入本車次車牌", slot.plate);
                    if(p !== null) { slot.plate = p.toUpperCase(); autoSave(); }
                }
                activeIdx = idx; render();
            };
            grid.appendChild(div);
        });

        const key = document.getElementById('search').value.toUpperCase();
        const container = document.getElementById('cardList');
        container.innerHTML = "";

        products.filter(p => {
            const matchCat = curCat === 'ALL' || p.name.includes(curCat);
            const matchSearch = p.item.includes(key) || p.name.includes(key) || p.date.includes(key);
            const visible = p.truckIdx === -1 || p.truckIdx === activeIdx;
            return matchCat && matchSearch && visible;
        }).forEach(p => {
            const div = document.createElement('div');
            div.className = `item-card type-${getType(p.name)} ${p.locked ? 'is-locked' : ''} ${p.truckIdx === activeIdx ? 'on-truck' : ''}`;
            
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-size:12px;">
                    <span style="color:#666;">品號: ${p.item}</span>
                    <span class="date-tag">效期: ${p.date}</span>
                </div>
                <div class="item-name">${p.name}</div>
                <div class="qty-control">
                    <button class="qty-btn" onclick="updateQty(${p.id},-1)" ${p.locked?'disabled':''}>-</button>
                    <div class="qty-val">${p.act}</div>
                    <button class="qty-btn" onclick="updateQty(${p.id},1)" ${p.locked?'disabled':''}>+</button>
                </div>
                <div class="abnormal-group">
                    <label class="abnormal-item"><input type="checkbox" ${p.abImg?'checked':''} onchange="setAb(${p.id},'abImg',this.checked)" ${p.locked?'disabled':''}> 外觀異常</label>
                    <label class="abnormal-item"><input type="checkbox" ${p.abExp?'checked':''} onchange="setAb(${p.id},'abExp',this.checked)" ${p.locked?'disabled':''}> 效期錯誤</label>
                    <label class="abnormal-item"><input type="checkbox" ${p.abMix?'checked':''} onchange="setAb(${p.id},'abMix',this.checked)" ${p.locked?'disabled':''}> 混合效期</label>
                </div>
                <input type="text" class="search-bar" style="margin-bottom:8px; height:35px;" placeholder="其他備註..." value="${p.note}" onchange="setNote(${p.id},this.value)" ${p.locked?'disabled':''}>
                
                ${!p.locked ? 
                    `<button class="btn-main" style="background:var(--load); width:100%" onclick="lock(${p.id})">確認清點完畢待上車</button>` :
                    (p.truckIdx === activeIdx ? 
                        `<button class="btn-main" style="background:#636e72; width:100%" onclick="unload(${p.id})">✅ 本車次已裝載 (點擊卸下)</button>` :
                        `<button class="btn-main" style="background:var(--primary); width:100%" onclick="assign(${p.id})">指派至 ${truckSlots[activeIdx].plate || `第 ${truckSlots[activeIdx].seq} 趟`} 裝車</button>
                         <center><small style="color:#999; margin-top:10px; display:block;" onclick="unlock(${p.id})">點此解鎖重新編輯</small></center>`
                    )
                }
            `;
            container.appendChild(div);
        });
    }

    function updateQty(id, d) { products[id].act = Math.max(0, products[id].act + d); render(); autoSave(); }
    function setAb(id, field, val) { products[id][field] = val; render(); autoSave(); }
    function setNote(id, val) { products[id].note = val; autoSave(); }
    function lock(id) { products[id].locked = true; render(); autoSave(); }
    function unlock(id) { products[id].locked = false; render(); autoSave(); }
    function assign(id) {
        if(!truckSlots[activeIdx].plate) return alert("請先點擊上方車次區塊設定車牌");
        if(products.filter(p => p.truckIdx === activeIdx).length >= 14) return alert("本趟次已滿 14 板");
        products[id].truckIdx = activeIdx; render(); autoSave();
    }
    function unload(id) { products[id].truckIdx = -1; render(); autoSave(); }

    function resetSystem() { 
        if(confirm("⚠️ 注意：這將清除所有數據回到初始狀態。確定重置？")) { 
            localStorage.clear(); location.reload(); 
        } 
    }

    function getStatusStr(p) {
        let res = [];
        if(p.abImg) res.push("外觀異常");
        if(p.abExp) res.push("效期錯誤");
        if(p.abMix) res.push("效期混料");
        if(p.note) res.push(p.note);
        return res.length > 0 ? res.join("/") : "正常";
    }

    function generatePDF() {
        const today = new Date().toISOString().slice(0,10);
        document.getElementById('p-date').innerText = "日期：" + today;
        const tbody = document.getElementById('print-body');
        tbody.innerHTML = "";
        products.forEach(p => {
            const truckStr = p.truckIdx !== -1 ? `${truckSlots[p.truckIdx].plate}(第${truckSlots[p.truckIdx].seq}趟)` : "--";
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${truckStr}</td><td>${p.item}</td><td>${p.name}</td><td>${p.date}</td><td>${p.sys}</td><td>${p.act}</td><td>${getStatusStr(p)}</td>`;
            tbody.appendChild(tr);
        });
        window.print();
    }

    function exportExcel() {
        const rows = [["作業日期", "車牌號碼", "車次/趟序", "品號", "品名", "有效日期", "預設數", "實裝數", "差異", "狀態備註"]];
        const ds = new Date().toISOString().slice(0,10).replace(/-/g,'');
        products.forEach(p => {
            const truck = p.truckIdx !== -1 ? truckSlots[p.truckIdx] : null;
            rows.push([ds, truck?truck.plate:"", truck?`第 ${truck.seq} 趟`:"", p.item, p.name, p.date, p.sys, p.act, p.act-p.sys, getStatusStr(p)]);
        });
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "移倉紀錄");
        XLSX.writeFile(wb, `${ds}_移倉明細.xlsx`);
    }

    init();
</script>
</body>
</html>
