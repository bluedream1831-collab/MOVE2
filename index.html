<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>永豐金零股計算器-護眼版</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#556b2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定義護眼顏色變數 */
        :root {
            --bg-eye-care: #f3f4ed; /* 柔軟米白 */
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent-green: #556b2f; /* 暗橄欖綠 */
            --soft-red: #c66b6b;   /* 柔和紅 */
            --soft-green: #5a835a; /* 柔和綠 */
        }
        body { 
            background-color: var(--bg-eye-care); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; 
        }
        .btn-calculate {
            background-color: var(--accent-green);
        }
        .profit-pos { color: var(--soft-red); }
        .profit-neg { color: var(--soft-green); }
        input[type="number"] { font-size: 16px !important; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        <!-- 頂部標題 -->
        <header class="p-8 pb-4">
            <h1 class="text-2xl font-bold text-center tracking-tight" style="color: var(--accent-green);">永豐金零股計算器</h1>
            <p class="text-center text-xs text-gray-500 mt-1">手續費最低 1 元方案適用</p>
        </header>

        <!-- 主要表單 -->
        <main class="flex-grow p-6 pt-2 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm space-y-5 border border-gray-100">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">買入價格</label>
                        <input type="number" id="buyPrice" step="0.01" inputmode="decimal" class="w-full bg-gray-50 border-0 rounded-2xl p-4 text-lg font-medium focus:ring-2 focus:ring-green-200 outline-none" placeholder="0.0">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">賣出價格</label>
                        <input type="number" id="sellPrice" step="0.01" inputmode="decimal" class="w-full bg-gray-50 border-0 rounded-2xl p-4 text-lg font-medium focus:ring-2 focus:ring-green-200 outline-none" placeholder="0.0">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">成交股數</label>
                    <input type="number" id="shares" inputmode="numeric" class="w-full bg-gray-50 border-0 rounded-2xl p-4 text-lg font-medium focus:ring-2 focus:ring-green-200 outline-none" placeholder="10">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">手續費折扣</label>
                        <select id="discount" class="w-full bg-gray-50 border-0 rounded-2xl p-4 font-medium appearance-none">
                            <option value="2">2 折 (大戶投)</option>
                            <option value="1">1 折</option>
                            <option value="2.8">2.8 折</option>
                            <option value="10">無折扣</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">交易類型</label>
                        <select id="tradeType" class="w-full bg-gray-50 border-0 rounded-2xl p-4 font-medium appearance-none">
                            <option value="0.003">一般 (0.3%)</option>
                            <option value="0.0015">當沖 (0.15%)</option>
                        </select>
                    </div>
                </div>

                <button onclick="calculate()" class="w-full btn-calculate text-white text-lg font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all mt-2">
                    計算損益
                </button>
            </div>

            <!-- 結果顯示區 (初始隱藏) -->
            <div id="result" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-gray-100 animate-in fade-in duration-500">
                <div class="text-center mb-6">
                    <p class="text-sm text-gray-400 mb-1">預估淨損益</p>
                    <h2 id="netProfit" class="text-4xl font-black"></h2>
                </div>
                
                <div class="space-y-3 text-sm border-t border-gray-50 pt-5">
                    <div class="flex justify-between font-medium">
                        <span class="text-gray-400">投資報酬率</span>
                        <span id="roi"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">買入手續費</span>
                        <span id="buyFee" class="font-medium"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">賣出手續費</span>
                        <span id="sellFee" class="font-medium"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">證券交易稅</span>
                        <span id="tax" class="font-medium"></span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="p-6 text-center text-gray-400 text-xs">
            系統已自動套用：低於 1 元以 1 元計收
        </footer>
    </div>

    <script>
        // PWA Service Worker 註冊
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function calculate() {
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const shares = parseInt(document.getElementById('shares').value);
            const discount = parseFloat(document.getElementById('discount').value) / 10;
            const taxRate = parseFloat(document.getElementById('tradeType').value);

            if (!buyPrice || !sellPrice || !shares) {
                alert("請輸入價格與股數");
                return;
            }

            const baseRate = 0.001425;
            
            // 買入邏輯：金額 * 0.1425% * 折扣，最低 1 元
            const buyAmount = buyPrice * shares;
            let buyFee = Math.floor(buyAmount * baseRate * discount);
            if (buyFee < 1) buyFee = 1;

            // 賣出邏輯：金額 * 0.1425% * 折扣，最低 1 元
            const sellAmount = sellPrice * shares;
            let sellFee = Math.floor(sellAmount * baseRate * discount);
            if (sellFee < 1) sellFee = 1;

            // 交易稅 (賣出時收取，無條件捨去)
            const tax = Math.floor(sellAmount * taxRate);

            // 總支出 = 買入成本 + 買入手續費
            const totalOut = buyAmount + buyFee;
            // 總收入 = 賣出金額 - 賣出手續費 - 交易稅
            const totalIn = sellAmount - sellFee - tax;
            
            const netProfit = totalIn - totalOut;
            const roi = (netProfit / totalOut) * 100;

            // 顯示結果
            document.getElementById('result').classList.remove('hidden');
            
            const profitElem = document.getElementById('netProfit');
            profitElem.innerText = `${netProfit > 0 ? '+' : ''}${Math.round(netProfit).toLocaleString()}`;
            profitElem.style.color = netProfit >= 0 ? 'var(--soft-red)' : 'var(--soft-green)';

            const roiElem = document.getElementById('roi');
            roiElem.innerText = `${roi.toFixed(2)}%`;
            roiElem.style.color = roi >= 0 ? 'var(--soft-red)' : 'var(--soft-green)';
            
            document.getElementById('buyFee').innerText = `${buyFee} 元`;
            document.getElementById('sellFee').innerText = `${sellFee} 元`;
            document.getElementById('tax').innerText = `${tax.toLocaleString()} 元`;
            
            // 平滑滾動到結果
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
