<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>永豐金零股計算器-終極版</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#556b2f">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-eye: #f3f4ed; --green: #556b2f; --red: #c66b6b; --low-green: #5a835a; }
        body { background-color: var(--bg-eye); color: #333; font-family: sans-serif; }
        .card { background: white; border-radius: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        input, select { background: #f9f9f7 !important; border: 1px solid #e2e2da !important; border-radius: 0.75rem !important; padding: 0.75rem !important; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <header class="text-center py-4">
            <h1 class="text-xl font-bold" style="color: var(--green);">永豐金零股損益 (終極優化版)</h1>
        </header>

        <!-- 交易時間提醒 (可折疊) -->
        <details class="mb-4 text-xs text-gray-500 card p-3">
            <summary class="cursor-pointer font-bold">⏰ 零股交易時間 (點擊展開)</summary>
            <div class="mt-2 space-y-1 border-t pt-2">
                <p>● 盤中：09:00-13:30 (1分撮合)</p>
                <p>● 盤後：13:40-14:30 (一次撮合)</p>
                <p>● 交割：成交日後第 2 個工作天 (T+2)</p>
            </div>
        </details>

        <!-- 輸入區 -->
        <div class="card p-5 mb-4 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold text-gray-400">買入單價</label>
                    <input type="number" id="buyPrice" step="0.01" inputmode="decimal" class="w-full text-lg font-bold" placeholder="0.0">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400">成交股數</label>
                    <input type="number" id="shares" inputmode="numeric" class="w-full text-lg font-bold" placeholder="10">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold text-gray-400">手續費折扣</label>
                    <select id="discount" class="w-full font-bold" onchange="savePrefs()">
                        <option value="2">2 折 (大戶投)</option>
                        <option value="1">1 折</option>
                        <option value="2.8">2.8 折</option>
                        <option value="10">無折扣</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400">預計賣出價</label>
                    <input type="number" id="sellPrice" step="0.01" inputmode="decimal" class="w-full text-lg font-bold">
                </div>
            </div>
            <button onclick="calculate()" class="w-full py-4 text-white font-bold rounded-xl shadow-lg" style="background: var(--green);">開始試算</button>
        </div>

        <!-- 結果分析 -->
        <div id="res" class="hidden space-y-4">
            <!-- 保本分析 -->
            <div class="card p-5 border-l-4" style="border-left-color: var(--green);">
                <h3 class="text-xs font-bold text-gray-400 mb-2 uppercase">保本點分析 (已考慮跳動單位)</h3>
                <div class="flex justify-between items-end">
                    <div>
                        <span class="text-2xl font-black" id="bePrice"></span>
                        <p class="text-[10px] text-gray-500" id="tickInfo"></p>
                    </div>
                    <div class="text-right">
                        <span class="text-sm font-bold" id="bePercent"></span>
                        <p class="text-[10px] text-gray-500">需漲幅</p>
                    </div>
                </div>
            </div>

            <!-- 實際損益 -->
            <div class="card p-5">
                <div class="text-center border-b pb-4 mb-4">
                    <p class="text-xs text-gray-400">預估淨利 (扣除所有成本)</p>
                    <h2 id="netProfit" class="text-4xl font-black mt-1"></h2>
                    <p id="roi" class="text-sm font-bold mt-1"></p>
                </div>
                <div class="grid grid-cols-2 gap-y-2 text-xs text-gray-500">
                    <span>買入總成本 (T+2 扣款):</span> <span id="c1" class="text-right text-gray-800"></span>
                    <span>預估回收款 (T+2 入帳):</span> <span id="c2" class="text-right text-gray-800"></span>
                    <span>總手續費 (永豐金最低1元):</span> <span id="c3" class="text-right text-blue-600"></span>
                    <span>證券交易稅 (0.3%):</span> <span id="c4" class="text-right text-orange-600"></span>
                </div>
            </div>
        </div>

        <footer class="text-center py-6 text-[10px] text-gray-400">
            本工具僅供參考，實際金額以券商帳單為準。
        </footer>
    </div>

    <script>
        // 台股跳動單位邏輯
        function getTickSize(price) {
            if (price < 10) return 0.01;
            if (price < 50) return 0.05;
            if (price < 100) return 0.1;
            if (price < 500) return 0.5;
            if (price < 1000) return 1.0;
            return 5.0;
        }

        // 自動儲存偏好
        function savePrefs() {
            localStorage.setItem('stock_discount', document.getElementById('discount').value);
        }

        // 載入偏好
        window.onload = () => {
            const d = localStorage.getItem('stock_discount');
            if (d) document.getElementById('discount').value = d;
        }

        function calculate() {
            const bp = parseFloat(document.getElementById('buyPrice').value);
            const sp = parseFloat(document.getElementById('sellPrice').value) || 0;
            const sh = parseInt(document.getElementById('shares').value);
            const disc = parseFloat(document.getElementById('discount').value) / 10;

            if (!bp || !sh) return;

            // 1. 買入計算
            let bFee = Math.floor(bp * sh * 0.001425 * disc);
            if (bFee < 1) bFee = 1;
            const totalCost = (bp * sh) + bFee;

            // 2. 理論保本價
            let rawBe = totalCost / (sh * (1 - 0.003 - (0.001425 * disc)));
            if (Math.floor(rawBe * sh * 0.001425 * disc) < 1) {
                rawBe = (totalCost + 1) / (sh * (1 - 0.003));
            }

            // 3. 對齊跳動單位 (Tick)
            const tick = getTickSize(bp);
            let finalBe = Math.ceil(rawBe / tick) * tick;
            if (finalBe <= bp) finalBe += tick; // 至少要高一檔

            const ticksNeeded = Math.round((finalBe - bp) / tick);

            // 更新介面 - 保本
            document.getElementById('res').classList.remove('hidden');
            document.getElementById('bePrice').innerText = finalBe.toFixed(2) + " 元";
            document.getElementById('bePercent').innerText = "+" + (((finalBe - bp) / bp) * 100).toFixed(2) + "%";
            document.getElementById('tickInfo').innerText = `需上漲約 ${ticksNeeded} 個跳動點 (Tick)`;

            // 4. 實際損益計算
            if (sp > 0) {
                let sFee = Math.floor(sp * sh * 0.001425 * disc);
                if (sFee < 1) sFee = 1;
                const tax = Math.floor(sp * sh * 0.003);
                const netRevenue = (sp * sh) - sFee - tax;
                const profit = netRevenue - totalCost;
                const roi = (profit / totalCost) * 100;

                const pElem = document.getElementById('netProfit');
                pElem.innerText = (profit >= 0 ? "+" : "") + Math.round(profit).toLocaleString() + " 元";
                pElem.style.color = profit >= 0 ? 'var(--red)' : 'var(--low-green)';
                
                document.getElementById('roi').innerText = `投資報酬率 ${roi.toFixed(2)}%`;
                document.getElementById('roi').style.color = profit >= 0 ? 'var(--red)' : 'var(--low-green)';

                document.getElementById('c1').innerText = Math.round(totalCost).toLocaleString() + " 元";
                document.getElementById('c2').innerText = Math.round(netRevenue).toLocaleString() + " 元";
                document.getElementById('c3').innerText = (bFee + sFee) + " 元";
                document.getElementById('c4').innerText = tax.toLocaleString() + " 元";
            } else {
                document.getElementById('netProfit').innerText = "---";
                document.getElementById('roi').innerText = "輸入賣出價查看明細";
            }

            window.scrollTo({ top: 500, behavior: 'smooth' });
        }
    </script>
</body>
</html>
